<template>
    <div class="guide-card">

        <!-- ===== HEADER: Logo + Titolo ===== -->
        <div class="guide-header">
            <img src={logoUrl} alt="Abiogen Pharma" class="guide-logo" />
            <div class="guide-header-text">
                <h2 class="guide-title">Guida Operatore</h2>
                <p class="guide-case-subject">{caseSubject}</p>
            </div>
        </div>

        <!-- ===== TAB SELECTOR ===== -->
        <div class="tab-bar">
            <template for:each={tabs} for:item="tab">
                <button key={tab.id} class={tab.btnClass}
                        onclick={handleTabSelect} data-id={tab.id}>
                    {tab.label}
                </button>
            </template>
        </div>

        <!-- ===== PROGRESS BAR ===== -->
        <div class="progress-track">
            <div class="progress-fill" style={progressStyle}></div>
        </div>
        <div class="progress-label">
            <span>{completedCount} / {totalCount} task completati</span>
            <span class="progress-pct">{progressPct}%</span>
        </div>

        <!-- ===== CHECKLIST ===== -->
        <ul class="task-list">
            <template for:each={tasks} for:item="task">
                <li key={task.id} class={task.rowClass}>
                    <button
                        class={task.checkClass}
                        onclick={handleTaskToggle}
                        data-id={task.id}
                        aria-label="Segna task">
                        <template lwc:if={task.done}>
                            <span class="check-icon">&#10003;</span>
                        </template>
                    </button>
                    <span class={task.labelClass}>{task.label}</span>
                </li>
            </template>
        </ul>

        <!-- ===== SUCCESS STATE: tutti i task completati ===== -->
        <template lwc:if={isAllDone}>
            <div class="done-banner">
                <span class="done-icon">&#10003;</span>
                Checklist completata! Il Case è pronto per la chiusura.
            </div>
        </template>

    </div>
</template>
