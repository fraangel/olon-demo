<template>
    <div class="guide-card">

        <!-- ===== HEADER: Logo + Titolo ===== -->
        <div class="guide-header">
            <img src={logoUrl} alt="Abiogen Pharma" class="guide-logo" />
            <div class="guide-header-text">
                <h2 class="guide-title">Guida Operatore</h2>
                <p class="guide-case-subject">{caseSubject}</p>
            </div>
        </div>

        <!-- ===== PROGRESS BAR ===== -->
        <div class="progress-track">
            <div class="progress-fill" style={progressStyle}></div>
        </div>
        <div class="progress-label">
            <span>{completedCount} / {totalCount} task completati</span>
            <span class="progress-pct">{progressPct}%</span>
        </div>

        <!-- ===== CHECKLIST (tipo riconosciuto) ===== -->
        <template lwc:if={hasChecklist}>
            <ul class="task-list">
                <template for:each={tasks} for:item="task">
                    <li key={task.id} class={task.rowClass}>
                        <button
                            class={task.checkClass}
                            onclick={handleTaskToggle}
                            data-id={task.id}
                            aria-label="Segna task">
                            <template lwc:if={task.done}>
                                <span class="check-icon">&#10003;</span>
                            </template>
                        </button>
                        <span class={task.labelClass}>
                            {task.label}
                            <template lwc:if={task.critical}>
                                <span class="critical-badge">&#9888; Critico</span>
                            </template>
                        </span>
                    </li>
                </template>
            </ul>
        </template>

        <!-- ===== Tipo non mappato ===== -->
        <template lwc:else>
            <p class="no-checklist">
                Nessuna checklist disponibile per il tipo: <strong>{caseType}</strong>
            </p>
        </template>

        <!-- ===== SMART ALERT: task critici non completati ===== -->
        <template lwc:if={showCriticalAlert}>
            <div class="critical-alert">
                <span class="alert-icon">&#9888;</span>
                <span>Attenzione: completare i task critici prima di chiudere il Case.</span>
            </div>
        </template>

        <!-- ===== SUCCESS STATE: tutti i task completati ===== -->
        <template lwc:if={isAllDone}>
            <div class="done-banner">
                <span class="done-icon">&#10003;</span>
                Checklist completata! Il Case è pronto per la chiusura.
            </div>
        </template>

        <!-- ===== FOOTER: Pulsante AI / Spinner ===== -->
        <div class="guide-footer">
            <template lwc:if={isAiLoading}>
                <div class="loading-row">
                    <div class="spinner-ring"></div>
                    <span class="loading-label">Agentforce sta analizzando il record...</span>
                </div>
            </template>
            <template lwc:else>
                <button class="btn-ai" onclick={handleAiAnalyze}>
                    <span class="ai-icon">&#10024;</span> Analisi AI
                </button>
            </template>
        </div>

    </div>
</template>
